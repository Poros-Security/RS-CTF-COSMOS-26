packages:
  - "."

blockExoticSubdeps: true
minimumReleaseAge: 10080
# Dependabot updates lockfiles with --no-save and cannot answer pnpm's strict
# approval prompt. Its seven-day cooldown above enforces the same delay for
# routine version PRs; loose mode also leaves security updates unblocked.
minimumReleaseAgeStrict: false
trustPolicy: no-downgrade
trustPolicyExclude:
  # Babel still requires this mature release; pin the one reviewed exception.
  - "semver@6.3.1"
  # Node 22 declarations require this official undici type release, which was
  # published without the provenance attached to the prior patch.
  - "undici-types@6.20.0"

allowBuilds:
  esbuild: true

audit:
  ignore:
    # Transitive dev-dependency advisory: upstream braces (<=3.0.3) has no published >=3.0.4 patch yet.
    - GHSA-vfj7-8cjw-p6xm
    # Transitive source-map-js denial of service advisory
    - GHSA-68fv-2mgg-jv7q

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-68fv-2mgg-jv7q

overrides:
  canvas: "npm:dry-uninstall"
  # Force-patch the transitive form-data CRLF-injection advisory (<4.0.6).
  form-data: ">=4.0.6"
  # The formatter's minimatch 9 branch cannot consume the only release that
  # fixes both 2026 brace-expansion denial-of-service advisories.
  "@trivago/prettier-plugin-sort-imports>minimatch": "10.2.5"
  "minimatch>brace-expansion": "5.0.12"
  # Patch the OpenAPI generator's AJV URI parser against host confusion.
  fast-uri: "3.1.6"
  # Patch OpenAPI YAML merge CPU limits (GHSA-2883-xcg3-v3hh).
  "@apidevtools/json-schema-ref-parser>js-yaml": "4.3.2"
  # Keep Pixi's XML parser on its existing patch branch with the security fixes.
  "pixi.js>@xmldom/xmldom": "0.8.15"
  # Keep each consumer on its existing Nano ID major while fixing bounded-loop
  # handling for zero and negative custom-generator sizes.
  "@xdsec/wsrx>nanoid": "5.1.16"
  "postcss>nanoid": "3.3.18"
  brace-expansion@>=4.0.0 <5.0.10: ^5.0.10
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  dompurify@>=3.4.13 <=3.4.15: ^3.4.16
  fast-uri@>=3.0.0 <3.1.7: ^3.1.7
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  postcss-selector-parser@>=7.1.0 <7.1.3: ^7.1.3

minimumReleaseAgeExclude:
  # Exact security hotfixes may bypass the seven-day cooldown; every unrelated
  # newly published version must still age normally.
  - react-router@8.3.0
  - brace-expansion@5.0.9
  - fast-uri@3.1.6
  - postcss@8.5.23
  - dompurify@3.4.13
  - nanoid@3.3.18
  - postcss-selector-parser@7.1.3
  - fast-uri@3.1.7
  - fast-uri@3.1.8
  - brace-expansion@5.0.12
  - brace-expansion@5.0.11
  - brace-expansion@5.0.10
  - dompurify@3.4.16
